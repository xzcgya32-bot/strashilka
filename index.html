<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Біжи!</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;user-select:none}
  canvas#c{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none}
  #time{position:absolute;top:14px;left:18px;font-size:28px;font-weight:700;text-shadow:0 2px 6px #000}
  #best{position:absolute;top:50px;left:18px;font-size:14px;opacity:.8;text-shadow:0 1px 4px #000}
  #msg{position:absolute;top:30%;width:100%;text-align:center;font-size:44px;font-weight:800;text-shadow:0 3px 10px #000}
  #cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%;opacity:.7}
  #radar{position:absolute;top:14px;right:14px;width:160px;height:160px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.4)}
  #speedwrap{position:absolute;bottom:26px;left:50%;width:300px;margin-left:-150px;text-align:center;font-size:13px;text-shadow:0 1px 4px #000}
  #speedbar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
  #speedfill{height:100%;width:0;background:linear-gradient(90deg,#4ade80,#facc15,#f87171)}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(255,0,0,.75) 100%);opacity:0}
  #menu{position:fixed;inset:0;background:rgba(10,12,20,.88);display:flex;align-items:center;justify-content:center;z-index:5}
  #card{max-width:560px;padding:28px 34px;text-align:center}
  #card h1{margin:0 0 6px;font-size:40px}
  #card p{margin:6px 0;opacity:.9;line-height:1.45}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin:16px auto;width:max-content;font-size:15px}
  kbd{background:#2a2f45;border:1px solid #4a5073;border-radius:5px;padding:1px 7px;font-family:inherit}
  .pick{display:flex;gap:12px;justify-content:center;margin:14px 0;font-size:13px}
  .pick label{background:#1c2133;border:1px dashed #4a5073;border-radius:8px;padding:8px 12px;cursor:pointer}
  .pick img{display:block;width:70px;height:70px;object-fit:cover;border-radius:6px;margin:0 auto 6px}
  button{background:#ef4444;color:#fff;border:0;border-radius:10px;padding:13px 34px;font-size:19px;font-weight:700;cursor:pointer;margin-top:8px}
  button:hover{background:#dc2626}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="vig"></div>
  <div id="time">0.0</div>
  <div id="best"></div>
  <div id="msg"></div>
  <div id="cross"></div>
  <canvas id="radar" width="160" height="160"></canvas>
  <div id="speedwrap"><span id="speedtxt">0 м/с</span><div id="speedbar"><div id="speedfill"></div></div></div>
</div>

<div id="menu">
  <div id="card">
    <h1 id="title">БІЖИ!</h1>
    <p id="sub">Двоє переслідувачів швидші за тебе, але рухаються по прямій і повільно розвертаються. Використовуй перешкоди, стрибки та слайд.</p>
    <div class="keys">
      <div><kbd>W A S D</kbd></div><div>біг</div>
      <div><kbd>Пробіл</kbd></div><div>стрибок</div>
      <div><kbd>Shift</kbd> / <kbd>C</kbd></div><div>слайд (буст, що спадає; якщо тримати довго – повністю зупинить)</div>
      <div><kbd>Миша</kbd></div><div>огляд</div>
      <div><kbd>Esc</kbd></div><div>пауза</div>
    </div>
    <div class="pick">
      <label><img id="prev1" alt=""><span>Переслідувач №1 (змінити)</span><input id="f1" type="file" accept="image/png,image/*" hidden></label>
      <label><img id="prev2" alt=""><span>Переслідувач №2 (змінити)</span><input id="f2" type="file" accept="image/png,image/*" hidden></label>
    </div>
    <button id="play">Грати</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script>
(() => {
if (!window.THREE) { document.getElementById('sub').textContent = 'Не вдалося завантажити Three.js. Перевір інтернет і онови сторінку.'; document.getElementById('play').style.display = 'none'; return; }
'use strict';

// ---------- Налаштування ----------
const ARENA = 50;            // половина розміру карти (карта 100x100 м)
const GRAV = 26, JUMP_V = 9.2;
const RUN = 8;               // базова швидкість бігу
const SLIDE_BOOST = 6.5;     // додаткова швидкість на старті слайду
const SLIDE_DECEL = 5.0;     // як швидко гасне слайд, поки кнопка утримується
const SLIDE_COOLDOWN = 0.6;
const ENEMY_SPEED0 = 11.5, ENEMY_SPEED1 = 14, ENEMY_TURN = 2.2; // рад/с
const ENEMY_H = 2.6;
const GRACE = 3;

// ---------- Рендер ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const SKY = 0xa9cdea;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 35, 150);
const camera = new THREE.PerspectiveCamera(80, 1, 0.05, 300);
camera.rotation.order = 'YXZ';
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a7488, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(30, 60, 20);
scene.add(sun);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- Карта ----------
let seed = 20261023;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// підлога з сіткою
(function floor() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#8b9096'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1800; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .06})`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  g.strokeStyle = 'rgba(30,35,45,.55)'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(ARENA * 2 / 5, ARENA * 2 / 5);
  tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2, ARENA * 2), new THREE.MeshLambertMaterial({ map: tex }));
  m.rotation.x = -Math.PI / 2;
  scene.add(m);
})();

const boxes = [];
const edgeMat = new THREE.LineBasicMaterial({ color: 0x1b1f2a });
function addBox(cx, cz, w, d, h, color, y0 = 0, edges = true) {
  boxes.push({ minx: cx - w / 2, maxx: cx + w / 2, minz: cz - d / 2, maxz: cz + d / 2, miny: y0, maxy: y0 + h });
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
  mesh.position.set(cx, y0 + h / 2, cz);
  scene.add(mesh);
  if (edges) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
    e.position.copy(mesh.position); scene.add(e);
  }
}

// периметр
const WT = 2, WH = 12;
addBox(0, -ARENA - WT / 2, ARENA * 2 + WT * 2, WT, WH, 0x5b6270, 0, false);
addBox(0, ARENA + WT / 2, ARENA * 2 + WT * 2, WT, WH, 0x5b6270, 0, false);
addBox(-ARENA - WT / 2, 0, WT, ARENA * 2, WH, 0x5b6270, 0, false);
addBox(ARENA + WT / 2, 0, WT, ARENA * 2, WH, 0x5b6270, 0, false);

const SPAWNS = [[-40, -40], [40, 40]];
const placed = [];
function free(x, z, r) {
  if (Math.hypot(x, z) < 10 + r) return false;
  for (const s of SPAWNS) if (Math.hypot(x - s[0], z - s[1]) < 9 + r) return false;
  for (const p of placed) if (Math.hypot(x - p.x, z - p.z) < p.r + r + 2.5) return false;
  return true;
}
const palette = [0xc77d3a, 0x4f8fba, 0x7a9e5c, 0xb25f6a, 0x8a74b8, 0xd2b04c];
// сходинкові піраміди
for (let i = 0; i < 6; i++) {
  for (let t = 0; t < 40; t++) {
    const x = (rnd() * 2 - 1) * (ARENA - 9), z = (rnd() * 2 - 1) * (ARENA - 9);
    if (!free(x, z, 5)) continue;
    const col = palette[i % palette.length];
    addBox(x, z, 7, 7, 1, col);
    addBox(x, z, 4.6, 4.6, 2, col);
    addBox(x, z, 2.4, 2.4, 3, col);
    placed.push({ x, z, r: 5 }); break;
  }
}
// ящики та блоки
for (let i = 0, n = 0; i < 400 && n < 55; i++) {
  const w = 2 + rnd() * 4.5, d = 2 + rnd() * 4.5;
  const h = [1.2, 1.2, 1.4, 2.2, 3.4][Math.floor(rnd() * 5)];
  const x = (rnd() * 2 - 1) * (ARENA - 5), z = (rnd() * 2 - 1) * (ARENA - 5);
  const r = Math.max(w, d) / 2 + 0.3;
  if (!free(x, z, r)) continue;
  addBox(x, z, w, d, h, palette[Math.floor(rnd() * palette.length)]);
  placed.push({ x, z, r }); n++;
}

// ---------- Колізії ----------
function overlaps(b, p, r, h) {
  return p.x - r < b.maxx && p.x + r > b.minx && p.z - r < b.maxz && p.z + r > b.minz && p.y < b.maxy && p.y + h > b.miny;
}
function moveEntity(e, dt) {
  let blocked = false;
  // X
  e.pos.x += e.vel.x * dt;
  for (const b of boxes) if (overlaps(b, e.pos, e.r, e.h)) {
    const rise = b.maxy - e.pos.y;
    if (e.grounded && rise > 0 && rise <= e.step) e.pos.y = b.maxy;
    else { e.pos.x = e.vel.x > 0 ? b.minx - e.r : b.maxx + e.r; e.vel.x = 0; blocked = true; }
  }
  // Z
  e.pos.z += e.vel.z * dt;
  for (const b of boxes) if (overlaps(b, e.pos, e.r, e.h)) {
    const rise = b.maxy - e.pos.y;
    if (e.grounded && rise > 0 && rise <= e.step) e.pos.y = b.maxy;
    else { e.pos.z = e.vel.z > 0 ? b.minz - e.r : b.maxz + e.r; e.vel.z = 0; blocked = true; }
  }
  // Y
  e.vel.y -= GRAV * dt;
  e.pos.y += e.vel.y * dt;
  e.grounded = false;
  if (e.pos.y <= 0) { e.pos.y = 0; if (e.vel.y < 0) e.vel.y = 0; e.grounded = true; }
  for (const b of boxes) if (overlaps(b, e.pos, e.r, e.h)) {
    if (e.vel.y <= 0) { e.pos.y = b.maxy; e.vel.y = 0; e.grounded = true; }
    else { e.pos.y = b.miny - e.h; e.vel.y = 0; }
  }
  return blocked;
}

// ---------- Гравець ----------
const STAND_H = 1.75, SLIDE_H = 0.95;
const player = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  r: 0.4, h: STAND_H, step: 0.35, grounded: false,
  yaw: 0, pitch: 0,
  sliding: false, slideSpeed: 0, slideDir: new THREE.Vector2(0, -1), slideCd: 0,
  coyote: 0, jumpBuf: 0, camH: 1.6, roll: 0
};
const keys = {};
let slideHeld = false, slideReq = false, dragging = false;

// ---------- Переслідувачі ----------
const texLoader = new THREE.TextureLoader();
function placeholder(color, label) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#fff'; g.font = 'bold 120px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, 128, 140);
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.strokeRect(4, 4, 248, 248);
  return new THREE.CanvasTexture(c);
}
const enemies = [0, 1].map(i => {
  const mat = new THREE.MeshBasicMaterial({ map: placeholder(i ? '#2563eb' : '#dc2626', String(i + 1)), transparent: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  mesh.scale.set(ENEMY_H, ENEMY_H, 1);
  scene.add(mesh);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.7, 1.15, 32), new THREE.MeshBasicMaterial({ color: 0xff2222, transparent: true, opacity: .75, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; scene.add(ring);
  return { mesh, ring, mat, pos: new THREE.Vector3(), vel: new THREE.Vector3(), r: 0.5, h: ENEMY_H - 0.2, step: 0.4, grounded: false, heading: 0, stuck: 0, aspect: 1 };
});
function setEnemyImage(i, file) {
  const url = URL.createObjectURL(file);
  document.getElementById('prev' + (i + 1)).src = url;
  texLoader.load(url, tex => {
    const e = enemies[i];
    e.mat.map = tex; e.mat.needsUpdate = true;
    e.aspect = tex.image.width / tex.image.height;
    e.mesh.scale.set(ENEMY_H * Math.min(e.aspect, 1.4), ENEMY_H, 1);
  });
}
['f1', 'f2'].forEach((id, i) => document.getElementById(id).addEventListener('change', ev => { if (ev.target.files[0]) setEnemyImage(i, ev.target.files[0]); }));
// якщо гра відкрита через http(s), пробуємо підхопити enemy1.png / enemy2.png поруч із файлом
if (location.protocol.startsWith('http')) {
  [0, 1].forEach(i => texLoader.load(`enemy${i + 1}.png`, tex => {
    const e = enemies[i]; e.mat.map = tex; e.mat.needsUpdate = true;
    e.aspect = tex.image.width / tex.image.height;
    e.mesh.scale.set(ENEMY_H * Math.min(e.aspect, 1.4), ENEMY_H, 1);
    document.getElementById('prev' + (i + 1)).src = `enemy${i + 1}.png`;
  }, undefined, () => {}));
}

// ---------- Стан гри ----------
let state = 'menu'; // menu | play | dead
let time = 0, grace = 0, best = 0;
try { best = parseFloat(localStorage.getItem('run_best') || '0') || 0; } catch (e) {}
const $ = id => document.getElementById(id);

function reset() {
  player.pos.set(0, 0, 0); player.vel.set(0, 0, 0);
  player.yaw = 0; player.pitch = 0; player.h = STAND_H;
  player.sliding = false; player.slideCd = 0; player.slideSpeed = 0;
  enemies.forEach((e, i) => {
    e.pos.set(SPAWNS[i][0], 0, SPAWNS[i][1]); e.vel.set(0, 0, 0);
    e.heading = Math.atan2(-e.pos.x, -e.pos.z); e.stuck = 0;
  });
  for (const k in keys) keys[k] = false;
  slideHeld = false; slideReq = false; dragging = false;
  player.grounded = true; player.coyote = 0; player.jumpBuf = 0; player.camH = 1.6; player.roll = 0;
  time = 0; grace = GRACE; state = 'play';
}

function die() {
  state = 'dead';
  if (time > best) { best = time; try { localStorage.setItem('run_best', String(best)); } catch (e) {} }
  document.exitPointerLock();
  $('title').textContent = 'Тебе спіймали!';
  $('sub').textContent = `Ти протримався ${time.toFixed(1)} с. Рекорд: ${best.toFixed(1)} с.`;
  $('play').textContent = 'Ще раз';
  $('menu').classList.remove('hidden');
}

// ---------- Керування ----------
let paused = false, lockWorks = false, lockTime = 0;
$('play').addEventListener('click', () => {
  if (state !== 'play') reset();
  paused = false;
  $('menu').classList.add('hidden');
  try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
});
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) { lockWorks = true; lockTime = performance.now(); $('menu').classList.add('hidden'); }
  else if (lockWorks && state === 'play') {
    paused = true;
    $('title').textContent = 'Пауза';
    $('sub').textContent = 'Натисни, щоб продовжити.';
    $('play').textContent = 'Продовжити';
    $('menu').classList.remove('hidden');
  }
});
addEventListener('mousedown', () => { dragging = true; });
addEventListener('mouseup', () => { dragging = false; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas && !(dragging && state === 'play' && !paused)) return;
  if (performance.now() - lockTime < 250 || Math.abs(e.movementX) > 300 || Math.abs(e.movementY) > 300) return;
  player.yaw -= e.movementX * 0.0022;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - e.movementY * 0.0022));
});
addEventListener('keydown', e => {
  if (['Space', 'ShiftLeft', 'ShiftRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'Space') player.jumpBuf = 0.12;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyC') { slideHeld = true; slideReq = true; }
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; slideHeld = false; dragging = false; });
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyC') {
    slideHeld = keys.ShiftLeft || keys.ShiftRight || keys.KeyC || false;
  }
});

// ---------- Оновлення ----------
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
function updatePlayer(dt) {
  const p = player;
  p.slideCd = Math.max(0, p.slideCd - dt);
  p.jumpBuf = Math.max(0, p.jumpBuf - dt);
  p.coyote = p.grounded ? 0.1 : Math.max(0, p.coyote - dt);

  // вхідний напрямок
  const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const fx = -Math.sin(p.yaw), fz = -Math.cos(p.yaw), rx = Math.cos(p.yaw), rz = -Math.sin(p.yaw);
  let ix = fx * f + rx * s, iz = fz * f + rz * s;
  const il = Math.hypot(ix, iz);
  const hasInput = il > 0.01;
  if (hasInput) { ix /= il; iz /= il; }
  const cur = Math.hypot(p.vel.x, p.vel.z);

  // старт слайду
  if (slideReq) {
    if (p.grounded && !p.sliding && p.slideCd <= 0 && cur > 1) {
      p.sliding = true; p.h = SLIDE_H;
      p.slideDir.set(p.vel.x / cur, p.vel.z / cur);
      p.slideSpeed = Math.max(cur, RUN) + SLIDE_BOOST;
    }
    slideReq = false;
  }
  // кінець слайду
  if (p.sliding && (!slideHeld || !p.grounded)) {
    p.sliding = false; p.h = STAND_H; p.slideCd = SLIDE_COOLDOWN;
    // буст лишається в p.vel та поступово гасне в наземному русі
  }

  // стрибок
  if (p.jumpBuf > 0 && (p.grounded || p.coyote > 0)) {
    p.vel.y = JUMP_V; p.jumpBuf = 0; p.coyote = 0; p.grounded = false;
    if (p.sliding) { p.sliding = false; p.h = STAND_H; p.slideCd = SLIDE_COOLDOWN; }
  }

  // горизонтальний рух
  if (p.sliding) {
    p.slideSpeed = Math.max(0, p.slideSpeed - SLIDE_DECEL * dt);   // тримаєш довго – зупиняєшся
    if (hasInput) {                                                  // легке підруливання
      p.slideDir.x += (ix - p.slideDir.x) * Math.min(1, 1.6 * dt);
      p.slideDir.y += (iz - p.slideDir.y) * Math.min(1, 1.6 * dt);
      p.slideDir.normalize();
    }
    p.vel.x = p.slideDir.x * p.slideSpeed;
    p.vel.z = p.slideDir.y * p.slideSpeed;
  } else if (p.grounded) {
    if (hasInput) {
      const dx = cur > 0.2 ? p.vel.x / cur : ix, dz = cur > 0.2 ? p.vel.z / cur : iz;
      const k = Math.min(1, 14 * dt);
      let nx = dx + (ix - dx) * k, nz = dz + (iz - dz) * k;
      const nl = Math.hypot(nx, nz) || 1; nx /= nl; nz /= nl;
      const ns = cur > RUN ? Math.max(RUN, cur - 5.5 * dt) : Math.min(RUN, cur + 45 * dt);
      p.vel.x = nx * ns; p.vel.z = nz * ns;
    } else {
      const ns = cur < 0.3 ? 0 : Math.max(0, cur - (cur > RUN ? 6 : 40) * dt);
      if (cur > 0) { p.vel.x *= ns / cur; p.vel.z *= ns / cur; }
    }
  } else if (hasInput) { // у повітрі
    const cap = Math.max(RUN, cur);
    p.vel.x += ix * 22 * dt; p.vel.z += iz * 22 * dt;
    const l = Math.hypot(p.vel.x, p.vel.z);
    if (l > cap) { p.vel.x *= cap / l; p.vel.z *= cap / l; }
  }

  moveEntity(p, dt);
  if (p.sliding) { // фактична швидкість після зіткнень
    const a = Math.hypot(p.vel.x, p.vel.z);
    if (a < p.slideSpeed * 0.3 && p.slideSpeed > 2) p.slideSpeed *= 0.5;
  }
}

const JUMP_REACH = 1.7; // максимальна висота, яку переслідувачі здатні перестрибнути
function probeTop(e, ang, dist) {
  const pp = { x: e.pos.x + Math.sin(ang) * dist, y: e.pos.y + 0.05, z: e.pos.z + Math.cos(ang) * dist };
  let top = 0;
  for (const b of boxes) if (b.maxy > e.pos.y + e.step && overlaps(b, pp, e.r, e.h)) top = Math.max(top, b.maxy);
  return top;
}
function updateEnemies(dt) {
  const k = Math.min(1, time / 90);
  const speed = ENEMY_SPEED0 + (ENEMY_SPEED1 - ENEMY_SPEED0) * k;
  for (const e of enemies) {
    if (grace <= 0) {
      let want = Math.atan2(player.pos.x - e.pos.x, player.pos.z - e.pos.z);
      // ШІ: дивиться вперед і вирішує — стрибати чи обходити
      const sp0 = Math.hypot(e.vel.x, e.vel.z) || speed;
      const top = Math.max(probeTop(e, e.heading, 0.9 + sp0 * 0.1), probeTop(e, e.heading, 1.6 + sp0 * 0.14));
      if (top > 0) {
        const need = top - e.pos.y;
        if (need <= JUMP_REACH) {
          if (e.grounded) e.vel.y = Math.max(6, Math.min(10.8, Math.sqrt(2 * GRAV * (need + 0.4))));
        } else {
          const l = probeTop(e, e.heading + 0.8, 3), r = probeTop(e, e.heading - 0.8, 3);
          want = e.heading + (l <= r ? 0.9 : -0.9);
        }
      }
      let d = want - e.heading;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      const mt = ENEMY_TURN * dt;
      e.heading += Math.max(-mt, Math.min(mt, d));
      e.vel.x = Math.sin(e.heading) * speed;
      e.vel.z = Math.cos(e.heading) * speed;
    } else { e.vel.x = e.vel.z = 0; }
    const blocked = moveEntity(e, dt);
    if (blocked) {
      if (e.grounded) e.vel.y = 9.6; // перестрибують невисокі перешкоди
      e.stuck += dt;
      if (e.stuck > 0.9) { e.heading += (Math.random() < .5 ? -1 : 1) * 1.1; e.stuck = 0; }
    } else e.stuck = Math.max(0, e.stuck - dt);

    // візуал
    e.mesh.position.set(e.pos.x, e.pos.y + e.mesh.scale.y / 2 + Math.abs(Math.sin(time * 9)) * 0.08, e.pos.z);
    e.mesh.rotation.y = Math.atan2(camera.position.x - e.pos.x, camera.position.z - e.pos.z);
    e.ring.position.set(e.pos.x, e.pos.y + 0.03, e.pos.z);

    // смерть
    if (grace <= 0) {
      const dx = player.pos.x - e.pos.x, dz = player.pos.z - e.pos.z;
      if (Math.hypot(dx, dz) < 1.0 && player.pos.y < e.pos.y + ENEMY_H - 0.2 && player.pos.y + player.h > e.pos.y) die();
    }
  }
}

// ---------- HUD ----------
const radar = $('radar').getContext('2d');
function drawRadar() {
  const W = 160, C = 80, RANGE = 45;
  radar.clearRect(0, 0, W, W);
  radar.strokeStyle = 'rgba(255,255,255,.2)';
  radar.beginPath(); radar.arc(C, C, 40, 0, 7); radar.stroke();
  radar.beginPath(); radar.arc(C, C, 78, 0, 7); radar.stroke();
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw), rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
  for (const e of enemies) {
    const dx = e.pos.x - player.pos.x, dz = e.pos.z - player.pos.z;
    let x = (dx * rx + dz * rz) / RANGE * 78, y = -(dx * fx + dz * fz) / RANGE * 78;
    const l = Math.hypot(x, y); if (l > 72) { x *= 72 / l; y *= 72 / l; }
    radar.fillStyle = '#ff3b3b'; radar.beginPath(); radar.arc(C + x, C + y, 6, 0, 7); radar.fill();
  }
  radar.fillStyle = '#fff'; radar.beginPath(); radar.moveTo(C, C - 8); radar.lineTo(C - 5, C + 5); radar.lineTo(C + 5, C + 5); radar.fill();
}

function updateHud() {
  $('time').textContent = time.toFixed(1) + ' с';
  $('best').textContent = best > 0 ? `Рекорд: ${best.toFixed(1)} с` : '';
  const sp = Math.hypot(player.vel.x, player.vel.z);
  $('speedtxt').textContent = (player.sliding ? 'СЛАЙД  ' : '') + sp.toFixed(1) + ' м/с';
  $('speedfill').style.width = Math.min(100, sp / 15 * 100) + '%';
  $('msg').textContent = grace > 0 ? `Вони прокинуться через ${Math.ceil(grace)}…` : '';
  let near = 99;
  for (const e of enemies) near = Math.min(near, Math.hypot(e.pos.x - player.pos.x, e.pos.z - player.pos.z));
  $('vig').style.opacity = grace > 0 ? 0 : Math.max(0, Math.min(1, (9 - near) / 9));
  drawRadar();
}

// ---------- Цикл ----------
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  const active = state === 'play' && !paused;
  if (active) {
    const steps = 2, h = dt / steps;
    for (let i = 0; i < steps && state === 'play'; i++) {
      if (grace > 0) grace -= h; else time += h;
      updatePlayer(h);
      updateEnemies(h);
    }
  }
  // камера
  const p = player;
  const targetH = p.sliding ? 0.65 : 1.6;
  p.camH += (targetH - p.camH) * Math.min(1, 14 * dt);
  p.roll += ((p.sliding ? 0.06 : 0) - p.roll) * Math.min(1, 10 * dt);
  camera.position.set(p.pos.x, p.pos.y + p.camH, p.pos.z);
  camera.rotation.set(p.pitch, p.yaw, p.roll);
  const sp = Math.hypot(p.vel.x, p.vel.z);
  camera.fov += ((80 + Math.max(0, sp - RUN) * 1.1) - camera.fov) * Math.min(1, 6 * dt);
  camera.updateProjectionMatrix();
  if (state === 'play') updateHud();
  renderer.render(scene, camera);
}
// початкова розстановка для фону меню
reset(); state = 'menu'; grace = GRACE;
enemies.forEach(e => {
  e.mesh.position.set(e.pos.x, e.mesh.scale.y / 2, e.pos.z);
  e.ring.position.set(e.pos.x, 0.03, e.pos.z);
});
requestAnimationFrame(loop);
})();
</script>
